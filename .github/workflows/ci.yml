name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo build lint typecheck test

  isolation:
    name: Tenant isolation + integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - run: pnpm test:integration

  rls-coverage:
    name: Migrate as resourcehub_migrator + RLS coverage check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: postgres
      DATABASE_URL_MIGRATOR: postgres://resourcehub_migrator:migrator_dev_pw@localhost:5432/resourcehub
      DATABASE_URL_PLATFORM: postgres://resourcehub_platform:platform_dev_pw@localhost:5432/resourcehub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@resourcehub/db...
      - name: Create roles and database
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -d postgres -f packages/db/sql/00-roles.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -d resourcehub -f packages/db/sql/01-database.sql
      - run: pnpm db:migrate
      - run: pnpm db:check-rls
      - name: Seed runs cleanly as the platform role
        run: pnpm db:seed

  contract:
    name: OpenAPI contract is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api
      - name: Fail if the generated OpenAPI or client changed
        run: git diff --exit-code -- packages/contracts/openapi.json packages/contracts/src/generated

  e2e:
    name: Playwright smoke (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL_MIGRATOR: postgres://resourcehub_migrator:migrator_dev_pw@localhost:55432/resourcehub
      DATABASE_URL_PLATFORM: postgres://resourcehub_platform:platform_dev_pw@localhost:55432/resourcehub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait postgres redis azurite mailpit soap-mock rest-mock
      - run: pnpm turbo build
      - run: pnpm db:migrate && pnpm db:seed
      - name: Start API and SPA
        run: |
          cp .env.example .env
          (cd apps/api && nohup node --env-file=../../.env dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/worker && nohup node --env-file=../../.env dist/main.js > /tmp/worker.log 2>&1 &)
          (cd apps/web && nohup pnpm exec vite --host > /tmp/web.log 2>&1 &)
          npx --yes wait-on@8 -t 60000 http://127.0.0.1:3000/api/v1/health http-get://127.0.0.1:5173
      - run: pnpm --filter @resourcehub/web exec playwright install --with-deps chromium
      - run: pnpm --filter @resourcehub/web e2e
      - if: failure()
        run: tail -n 200 /tmp/api.log /tmp/worker.log /tmp/web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
